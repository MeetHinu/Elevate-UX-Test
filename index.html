<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elevate Living — Interior Design Studio</title>
  <meta name="description" content="Elevate Living is a Melbourne interior design studio designing kitchens, bathrooms, laundries and living spaces from concept through to final styling." />
  <meta name="theme-color" content="#FBF8F1" />
  <link rel="canonical" href="https://elevatelivingstudio.com.au/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Elevate Living" />
  <meta property="og:title" content="Elevate Living — Interior Design Studio, Melbourne" />
  <meta property="og:description" content="Kitchens, bathrooms, laundries and living spaces, designed from concept through to final styling." />
  <meta property="og:url" content="https://elevatelivingstudio.com.au/" />
  <meta property="og:image" content="https://elevatelivingstudio.com.au/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "InteriorDesigner",
    "name": "Elevate Living Interior Design Studio",
    "url": "https://elevatelivingstudio.com.au/",
    "image": "https://elevatelivingstudio.com.au/og-image.jpg",
    "telephone": "+61402601808",
    "email": "info@elevatelivingstudio.com.au",
    "areaServed": "Melbourne, Victoria, Australia",
    "founder": { "@type": "Person", "name": "Hinal Dave" },
    "sameAs": ["https://instagram.com/elevateliving.design"],
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "17:30" }
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Hidden form so Netlify detects and registers this form at build time -->
  <form name="consultation-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="address" />
    <input type="text" name="project" />
    <input type="text" name="timeline" />
    <input type="text" name="hearAbout" />
    <textarea name="message"></textarea>
  </form>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
